on:
  push:
    branches: [main, master]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - auto_merge_enabled
  release:
    types: [published]
  merge_group:
  workflow_dispatch:

name: phs_internal_package_checks.yaml

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  PHS-checks:
    uses: Public-Health-Scotland/actions/.github/workflows/phs_package_checks_internal.yaml@v3.1.0
    with:
      run_tests: true
      lint: true
      lint_changed_files_only: true
      lint_error_on_lint: true
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    secrets: inherit
